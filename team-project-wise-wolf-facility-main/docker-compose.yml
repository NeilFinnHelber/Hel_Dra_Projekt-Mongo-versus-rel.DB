services:
  postgres:
    image: postgres:17.6-alpine
    container_name: pg_sj2526_WiseWOLF_4DHIF
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: pg2526_4dhif
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: pwd
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owner -d pg2526_4dhif"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: mongo_sj2526_WiseWOLF_4DHIF
    ports:
      - "27017:27017"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whitewolf_app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pg2526_4dhif?reWriteBatchedInserts=true
      SPRING_DATASOURCE_USERNAME: owner
      SPRING_DATASOURCE_PASSWORD: pwd
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      APP_SEED_ENABLED: "true"
      APP_SEED_COUNT: "1000"
      APP_SEED_CHUNK_SIZE: "500"
      APP_MONGODB_URI: mongodb://mongo:27017
      APP_MONGODB_DATABASE: videothek
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped
