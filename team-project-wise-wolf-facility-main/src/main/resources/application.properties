spring.application.name=sj2526-pos1-java-seed
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:15432/pg2526_4dhif?reWriteBatchedInserts=true
spring.datasource.username=owner
spring.datasource.password=pwd
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# mongo persistenz variante (nosql package)
app.mongodb.uri=mongodb://localhost:27017
app.mongodb.database=videothek

# Seed data for the Mongo-vs-relational benchmark (10 - 100.000 test cases)
app.seed.enabled=true
app.seed.count=1000
app.seed.chunk-size=500

# Testdaten generator (testdata package, siehe docs/testdatengenerator.md)
# nur mit app.testdata.enabled=true aktiv: leert die ziel db(s), befuellt sie
# reproduzierbar und beendet danach die app. count = anzahl customers (10-100000)
app.testdata.enabled=false
app.testdata.count=1000
app.testdata.seed=42
app.testdata.target=both
app.testdata.chunk-size=1000
app.testdata.allowed-hosts=localhost,127.0.0.1,::1,postgres,mongo,host.docker.internal
# POST /tests/testdata in der laufenden app (leert ziel db(s)!), nur fuer lokale messungen einschalten
app.testdata.endpoint-enabled=false

# JDBC/Hibernate batching so bulk writes stay comparable to MongoDB
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Workaround: springdoc-openapi (up to 2.8.8) calls HateoasProperties.getUseHalAsDefaultJsonMediaType()
# which was removed in Spring Boot 3.5.0. Exclude the broken HATEOAS bridge until springdoc releases
# a compatible version. HATEOAS links in API responses are unaffected.
spring.autoconfigure.exclude=org.springdoc.core.configuration.SpringDocHateoasConfiguration
