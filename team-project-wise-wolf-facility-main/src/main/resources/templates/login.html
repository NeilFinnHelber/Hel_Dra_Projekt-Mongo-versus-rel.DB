<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – White Wolf</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f5f5f5; }
        .login-box {
            background: #fff;
            border: 2px solid #000;
            padding: 3rem 2.5rem;
            width: min(420px, 95vw);
            box-shadow: 6px 6px 0 #000;
        }
        .login-box h1 { font-size: 1.8rem; margin-bottom: 0.25rem; text-transform: uppercase; }
        .login-box .sub { color: #707070; margin-bottom: 2rem; font-size: 0.9rem; }
        .login-box .form-row { margin-bottom: 1.25rem; }
        .login-box label { display: block; font-size: 0.82rem; font-weight: bold; text-transform: uppercase; margin-bottom: 0.4rem; }
        .login-box input[type=text],
        .login-box input[type=password] {
            width: 100%; padding: 0.75rem 1rem;
            border: 2px solid #000; font-size: 1rem; outline: none;
        }
        .login-box input:focus { background: #e0e0e0; }
        .login-box .btn-login {
            width: 100%; padding: 0.85rem;
            background: #000; color: #fff;
            border: 2px solid #000; font-size: 1rem;
            font-weight: bold; text-transform: uppercase;
            cursor: pointer; margin-top: 0.5rem;
        }
        .login-box .btn-login:hover { background: #333; }
        .error-msg {
            background: #e0e0e0; border: 2px solid #000;
            padding: 0.75rem 1rem; margin-bottom: 1.5rem;
            font-size: 0.9rem; font-weight: bold;
        }
        .back-link { display: block; text-align: center; margin-top: 1.5rem; color: #707070; font-size: 0.85rem; }
        .back-link a { color: #000; font-weight: bold; }
        .users-hint {
            margin-top: 1.5rem; padding: 1rem;
            background: #f5f5f5; border: 1px solid #ccc;
            font-size: 0.8rem; color: #555;
        }
        .users-hint strong { display: block; margin-bottom: 0.5rem; text-transform: uppercase; font-size: 0.75rem; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🐺 White Wolf</h1>
        <p class="sub">Bitte melde dich an, um fortzufahren.</p>

        <div class="error-msg" th:if="${param.error}">
            ❌ Falscher Benutzername oder Passwort.
        </div>
        <div class="error-msg" th:if="${param.logout}" style="background:#fff;">
            ✅ Erfolgreich abgemeldet.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-row">
                <label for="username">Benutzername</label>
                <input type="text" id="username" name="username" placeholder="z.B. admin" autocomplete="username" autofocus />
            </div>
            <div class="form-row">
                <label for="password">Passwort</label>
                <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" />
            </div>
            <button type="submit" class="btn-login">🔑 Anmelden</button>
        </form>

        <p class="back-link">← <a href="/">Zurück zur Startseite</a></p>

        <div class="users-hint">
            <strong>Demo-Zugangsdaten</strong>
            <code>admin / admin</code> &nbsp;·&nbsp;
            <code>employee / employee</code> &nbsp;·&nbsp;
            <code>customer / customer</code>
        </div>
    </div>
</body>
</html>
